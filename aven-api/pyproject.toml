[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the normal pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and throwaway test passwords are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
