name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: No patient data or secrets in the repo
        run: python scripts/check_no_phi.py
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest -q

  migrations:
    # Proves the migrations run on a real PostgreSQL, not just on SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aven
          POSTGRES_PASSWORD: aven
          POSTGRES_DB: aven
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aven:aven@localhost:5432/aven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Upgrade, downgrade, upgrade again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
