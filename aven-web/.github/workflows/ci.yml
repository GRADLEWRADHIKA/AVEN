name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No patient data or secrets in the repo
        run: python3 scripts/check_no_phi.py
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
